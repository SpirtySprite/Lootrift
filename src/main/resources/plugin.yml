name: Lootrift
version: '${project.version}'
main: com.kirugoldzzzz.lootrift.Lootrift
api-version: '1.21'
folia-supported: true
author: KiruGoldzZz
description: "Caisses animées, clés et récompenses pour Paper et Folia"
softdepend: [PlaceholderAPI, Vault, ModelEngine]
commands:
  crate:
    description: Administrer les caisses
    usage: /crate [admin|give <caisse>|apercu <caisse>|historique]
    permission: lootrift.admin.crates
    aliases: [crates, caisse, caisses]
  cle:
    description: Gérer les clés de caisse
    usage: /cle <give|take|set|physique> <joueur> <caisse> [quantite] | /cle all <caisse> [quantite]
    permission: lootrift.admin.crates
    aliases: [key, cles, keys, keyall]
permissions:
  lootrift.admin.crates:
    description: Administrer les caisses, les clés et les emplacements
    default: op
  lootrift.crates.bypass-cooldown:
    description: Ignorer le délai entre deux ouvertures de caisse
    default: op
  lootrift.alerts.caisses:
    description: Alertes de récompenses non remises et de configuration non enregistrée
    default: op
