name: Lootrift
version: '${project.version}'
main: com.kirugoldzzzz.lootrift.Lootrift
api-version: '1.21'
folia-supported: true
author: KiruGoldzZz
description: "Animated crates, keys and rewards for Paper and Folia"
softdepend: [PlaceholderAPI, Vault, ModelEngine]
commands:
  crate:
    description: Manage crates
    usage: /crate [admin|give <crate>|apercu <crate>|historique]
    permission: lootrift.admin.crates
    aliases: [crates, caisse, caisses]
  cle:
    description: Manage crate keys
    usage: /cle <give|take|set|physique> <player> <crate> [amount] | /cle all <crate> [amount]
    permission: lootrift.admin.crates
    aliases: [key, cles, keys, keyall]
permissions:
  lootrift.admin.crates:
    description: Manage crates, keys and locations
    default: op
  lootrift.crates.bypass-cooldown:
    description: Bypass the delay between two crate openings
    default: op
  lootrift.alerts.caisses:
    description: Alerts for undelivered rewards and unsaved configuration
    default: op
